<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Incyte Market Insights</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --accent:#5B4FE0;--accent-d:#4338ca;--accent-l:#ede9fe;--accent-l2:#f5f3ff;
    --ink:#1e1b39;--muted:#6b7280;--faint:#9ca3af;--border:#e7e5f0;--bg:#f7f7fb;--card:#fff;
    --green:#16a34a;--green-l:#dcfce7;--red:#dc2626;--red-l:#fee2e2;
    --shadow:0 1px 2px rgba(30,27,57,.04),0 1px 3px rgba(30,27,57,.06);
    --radius:12px;--font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1440px;margin:0 auto;padding:0 26px 60px}
  .appbar{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
  .appbar-in{max-width:1440px;margin:0 auto;padding:14px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#5B4FE0,#8b7ff0);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px}
  .brand .ttl{font-size:17px;font-weight:800;letter-spacing:-.3px}
  .brand .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
  .appbar .right{display:flex;align-items:center;gap:10px}
  .pill-btn{border:1px solid var(--border);background:#fff;border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer}
  .pill-btn:hover{border-color:var(--accent)}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-l);color:var(--accent-d);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .tabs{display:flex;gap:4px;padding:0 26px;max-width:1440px;margin:0 auto;border-bottom:1px solid var(--border);background:#fff}
  .tab{padding:13px 16px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .tab:hover:not(.active){color:var(--ink)}
  .fbar{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 16px;margin:18px 0;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
  .fg{position:relative;display:flex;flex-direction:column;gap:4px}
  .fg .lbl{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden}
  .seg button{border:none;background:#fff;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;border-right:1px solid var(--border);font-family:var(--font)}
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--accent);color:#fff}
  .msel{border:1.5px solid var(--border);border-radius:9px;padding:7px 11px;font-size:13px;background:#fff;color:var(--ink);min-width:150px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;user-select:none}
  .msel:hover{border-color:var(--accent)}
  .msel .ph{color:var(--faint)}
  .pop{position:absolute;top:100%;left:0;margin-top:5px;z-index:40;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(30,27,57,.14);width:240px;max-height:280px;overflow:auto;padding:6px}
  .pop input.search{width:100%;border:1px solid var(--border);border-radius:7px;padding:6px 9px;font-size:12.5px;margin-bottom:5px;outline:none}
  .opt{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:13px;border-radius:6px;cursor:pointer}
  .opt:hover{background:var(--accent-l2)}.opt input{accent-color:var(--accent)}
  .opt.disabled{color:var(--faint);font-style:italic;cursor:default}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:9px;padding:8px 15px;font-size:13px;font-weight:600;cursor:pointer}
  .btn.subtle{background:#fff;color:var(--muted);border-color:var(--border)}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-l);color:var(--accent-d);border-radius:16px;padding:4px 10px;font-size:12px;font-weight:600}
  .chip .x{cursor:pointer;opacity:.7}.chip .x:hover{opacity:1}
  .saved-chip{border:1px dashed var(--accent);color:var(--accent);background:var(--accent-l2);border-radius:16px;padding:5px 12px;font-size:12px;font-weight:700}
  .chips-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:-6px 0 16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card-hd{padding:15px 18px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .card-ttl{font-size:15px;font-weight:700}
  .card-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .badge24{font-size:9.5px;font-weight:800;background:var(--accent-l);color:var(--accent-d);padding:2px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.03em;vertical-align:middle}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}
  .kpi{padding:16px 18px}
  .kpi .k-lbl{font-size:11.5px;color:var(--muted);font-weight:600}
  .kpi .k-sub{font-size:10px;color:var(--faint);font-weight:500}
  .kpi .k-val{font-size:27px;font-weight:800;letter-spacing:-.5px;margin:7px 0 6px;line-height:1}
  .delta{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:14px}
  .delta.up{background:var(--green-l);color:var(--green)}.delta.down{background:var(--red-l);color:var(--red)}
  .delta .v{color:var(--muted);font-weight:500;margin-left:3px}
  .grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;margin-bottom:18px}
  .grid-even{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
  @media(max-width:1080px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2,.grid-even{grid-template-columns:1fr}}
  .map-seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;flex-wrap:wrap}
  .map-seg button{border:none;background:#fff;padding:6px 10px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;border-right:1px solid var(--border);font-family:var(--font);white-space:nowrap}
  .map-seg button:last-child{border-right:0}
  .map-seg button.on{background:var(--accent);color:#fff}
  .map-hint{font-size:11.5px;color:var(--accent-d);background:var(--accent-l2);border:1px solid #e0dbfb;border-radius:8px;padding:6px 11px;display:inline-flex;align-items:center;gap:6px}
  .state-path{cursor:pointer;transition:opacity .12s}.state-path:hover{opacity:.78}
  .legend{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);flex-wrap:wrap}
  .legend .bar{height:10px;width:160px;border-radius:5px;background:linear-gradient(90deg,#ede9fe,#a99cf2,#5B4FE0,#312e81)}
  .tip{position:fixed;z-index:200;pointer-events:none;background:#1e1b39;color:#fff;border-radius:8px;padding:8px 11px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;max-width:240px}
  .tip b{font-weight:700}.tip .d{color:#c4bdf5;font-size:11px;margin-top:2px}
  .rtbl{width:100%;border-collapse:collapse;font-size:13px}
  .rtbl th{text-align:left;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:8px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff}
  .rtbl th.num,.rtbl td.num{text-align:right}
  .rtbl td{padding:8px 14px;border-bottom:1px solid #f3f2f9}
  .rtbl tbody tr{cursor:pointer}.rtbl tbody tr:hover{background:var(--accent-l2)}
  .scrollbox{max-height:330px;overflow:auto}
  .rank-n{display:inline-flex;width:20px;height:20px;border-radius:6px;background:var(--accent-l);color:var(--accent-d);font-weight:700;font-size:11px;align-items:center;justify-content:center}
  .ovl{position:fixed;inset:0;background:rgba(30,27,57,.45);z-index:300;display:flex;justify-content:flex-end;opacity:0;pointer-events:none;transition:opacity .2s}
  .ovl.show{opacity:1;pointer-events:auto}
  .drawer{background:#fff;width:520px;max-width:100vw;height:100vh;overflow-y:auto;box-shadow:-8px 0 40px rgba(30,27,57,.2);transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1)}
  .ovl.show .drawer{transform:translateX(0)}
  .dh{padding:20px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;position:sticky;top:0;background:#fff;z-index:2}
  .dh .t{font-size:19px;font-weight:800}.dh .s{font-size:12px;color:var(--muted);margin-top:3px}
  .dh .x{border:none;background:var(--bg);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:15px;color:var(--muted)}
  .db{padding:18px 22px}
  .d-sec{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin:20px 0 11px;display:flex;align-items:center;gap:8px}
  .d-sec:first-child{margin-top:0}
  .mini-kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .mk{border:1px solid var(--border);border-radius:9px;padding:11px 12px}
  .mk .l{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:600}
  .mk .v{font-size:17px;font-weight:800;margin-top:2px}
  .link-btn{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:700;font-size:13px;cursor:pointer;background:none;border:none;padding:0;margin-top:18px}
  .export{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:#fff;border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
  .export:hover{border-color:var(--accent);color:var(--accent)}
  .infodot{display:inline-flex;width:14px;height:14px;border-radius:50%;background:var(--border);color:var(--muted);font-size:10px;align-items:center;justify-content:center;cursor:help;font-weight:700;margin-left:4px}
  .footer-note{font-size:11px;color:var(--faint);margin-top:8px;line-height:1.5}
  .stacked-legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
  .stacked-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:middle}
  /* chart bars */
  .hbrow{display:flex;align-items:center;gap:10px;margin-bottom:7px}
  .hbrow .hlbl{font-size:11px;color:#4b4670;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hbrow .htrk{flex:1;position:relative;height:14px;background:#f4f2fc;border-radius:4px}
  .hbrow .htrk i{position:absolute;inset:0;border-radius:4px}
  .hbrow .hval{width:54px;font-size:11px;font-weight:700;text-align:right}
  .spark{display:inline-block;vertical-align:middle}
</style>
</head>
<body>
<div id="root"></div>
<div class="tip" id="tip"></div>

<script type="text/plain" id="appsrc">
const { useState, useMemo, useEffect, useRef, Fragment } = React;
const ACCENT='#5B4FE0';

/* ============================ DATA ============================ */
const PERIODS=['2022-H1','2022-H2','2023-H1','2023-H2','2024-H1','2024-H2'];
const NAT_TREND=[165715,512360,1026557,1516229,5996415,7261998];
const TREND=PERIODS.map((p,i)=>({period:p,rx:NAT_TREND[i]}));
function rng(seed){let s=seed>>>0;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;};}
const STATE_DEFS=[
 ['AL','Alabama'],['AK','Alaska'],['AZ','Arizona'],['AR','Arkansas'],['CA','California'],['CO','Colorado'],
 ['CT','Connecticut'],['DE','Delaware'],['DC','District of Columbia'],['FL','Florida'],['GA','Georgia'],
 ['HI','Hawaii'],['ID','Idaho'],['IL','Illinois'],['IN','Indiana'],['IA','Iowa'],['KS','Kansas'],['KY','Kentucky'],
 ['LA','Louisiana'],['ME','Maine'],['MD','Maryland'],['MA','Massachusetts'],['MI','Michigan'],['MN','Minnesota'],
 ['MS','Mississippi'],['MO','Missouri'],['MT','Montana'],['NE','Nebraska'],['NV','Nevada'],['NH','New Hampshire'],
 ['NJ','New Jersey'],['NM','New Mexico'],['NY','New York'],['NC','North Carolina'],['ND','North Dakota'],['OH','Ohio'],
 ['OK','Oklahoma'],['OR','Oregon'],['PA','Pennsylvania'],['RI','Rhode Island'],['SC','South Carolina'],['SD','South Dakota'],
 ['TN','Tennessee'],['TX','Texas'],['UT','Utah'],['VT','Vermont'],['VA','Virginia'],['WA','Washington'],
 ['WV','West Virginia'],['WI','Wisconsin'],['WY','Wyoming'],
];
const VOL_RANK={NY:1,CA:2,PA:3,IL:4,OH:5,TX:6,FL:7};
const VOL_VALS=[2167720,2031661,178380,259329,201329,195460,184380];
const PREV_ANCHOR={'North Carolina':145000,'Alabama':95000,'Washington':73000,'South Carolina':63000,
  'Kentucky':52000,'Mississippi':50000,'Colorado':47000,'Missouri':44000,'Connecticut':42000,'Arkansas':41000};
const PEN_HIGH={NY:38,CA:34,NJ:21,MA:18,CT:16,MD:14,OH:12,PA:11,IL:10,RI:9};
const FIPS={AL:'01',AK:'02',AZ:'04',AR:'05',CA:'06',CO:'08',CT:'09',DE:'10',DC:'11',FL:'12',GA:'13',HI:'15',ID:'16',IL:'17',IN:'18',IA:'19',KS:'20',KY:'21',LA:'22',ME:'23',MD:'24',MA:'25',MI:'26',MN:'27',MS:'28',MO:'29',MT:'30',NE:'31',NV:'32',NH:'33',NJ:'34',NM:'35',NY:'36',NC:'37',ND:'38',OH:'39',OK:'40',OR:'41',PA:'42',RI:'44',SC:'45',SD:'46',TN:'47',TX:'48',UT:'49',VT:'50',VA:'51',WA:'53',WV:'54',WI:'55',WY:'56'};
function buildStates(){
  const r=rng(424242);
  return STATE_DEFS.map(([abbr,name])=>{
    let prev=PREV_ANCHOR[name]||Math.round(4000+r()*60000);
    let pen=PEN_HIGH[abbr]!==undefined?PEN_HIGH[abbr]:+(r()*9).toFixed(1);
    if(PREV_ANCHOR[name]&&PEN_HIGH[abbr]===undefined)pen=+(r()*4).toFixed(1);
    const treated=Math.round(prev*pen/1000);
    let rx=VOL_RANK[abbr]?VOL_VALS[VOL_RANK[abbr]-1]:Math.round(2000+treated*42+r()*30000);
    return {abbr,name,fips:FIPS[abbr],prev,pen,treated,rx,counties:Math.round(3+r()*70),claims:Math.round(treated*2.4)};
  });
}
/* County-level synthetic values (deterministic by FIPS). Quantity is FULL at county;
   Beneficiaries & Claims are a LESS-COUNT lower bound at county (CMS cell suppression). */
function countyVal(fips,st){
  const r=rng(parseInt(fips,10)||1);const n=Math.max(6,st.counties);
  const rx=Math.max(0,Math.round(st.rx/n*(0.3+r()*1.5)));
  const prev=Math.max(0,Math.round(st.prev/n*(0.4+r()*1.2)));
  const bene=Math.round(rx/55*(0.45+r()*0.4));   /* less count */
  const claims=Math.round(bene*2.3);             /* less count */
  return {rx,prev,bene,claims};
}
const STATES=buildStates();
const byName=Object.fromEntries(STATES.map(s=>[s.name,s]));
const byAbbr=Object.fromEntries(STATES.map(s=>[s.abbr,s]));
const TOP_PLANS=[
 {name:'HMSA - MEDICAL',rx:4800000,abbr:'HI'},{name:'HEALTH FIRST PHSP INC',rx:850000,abbr:'NY'},
 {name:'HMSA',rx:800000,abbr:'HI'},{name:'L.A. CARE HEALTH PLAN',rx:450000,abbr:'CA'},
 {name:'FIDELIS CARE',rx:430000,abbr:'NY'},{name:'HEALTH NET COMMUNITY SOLUTIONS',rx:300000,abbr:'CA'},
 {name:'HEALTHPLUS HP LLC',rx:240000,abbr:'NY'},{name:'METROPLUS HEALTH PLAN',rx:210000,abbr:'NY'},
 {name:'ANTHEM BLUE CROSS PARTNERSHIP PLAN',rx:180000,abbr:'CA'},{name:'INLAND EMPIRE HEALTH PLAN',rx:160000,abbr:'CA'},
];
const MIX_PLANS=TOP_PLANS.slice(0,6).map(p=>p.name);
const PLAN_COLORS=['#312e81','#4338ca','#5B4FE0','#7c6ff0','#a99cf2','#c7bdf6','#dcd8f4'];
const PLAN_MIX_TREND=PERIODS.map((p,pi)=>{
  const r=rng(pi*97+5);const base=TOP_PLANS.slice(0,6).map(pl=>pl.rx*(0.7+r()*0.6));
  const sum=base.reduce((a,b)=>a+b,0);const other=sum*0.18;const tot=sum+other;
  const row={period:p};MIX_PLANS.forEach((nm,i)=>row[nm]=+(base[i]/tot*100).toFixed(1));row.Other=+(other/tot*100).toFixed(1);return row;
});
function planSpark(seed){const r=rng(seed);return PERIODS.map(()=>Math.round(20+r()*80));}
const PLAN_INSTANCES={'ANTHEM BLUE CROSS PARTNERSHIP PLAN':23,'BLUE CROSS COMMUNITY HEALTH':1,
  'HEALTH NET COMMUNITY SOLUTIONS':9,'FIDELIS CARE':4,'L.A. CARE HEALTH PLAN':3,'HMSA - MEDICAL':1,
  'HMSA':1,'HEALTH FIRST PHSP INC':1,'HEALTHPLUS HP LLC':2,'METROPLUS HEALTH PLAN':1,'INLAND EMPIRE HEALTH PLAN':2};
function planIdRows(planName){
  const n=PLAN_INSTANCES[planName]||3;const r=rng(planName.length*7+n);
  const base=planName==='BLUE CROSS COMMUNITY HEALTH'?['IL']:[...STATE_DEFS].sort(()=>r()-0.5).slice(0,n).map(s=>s[0]);
  const tot=(TOP_PLANS.find(p=>p.name===planName)||{rx:120000}).rx;
  const contract='H'+(4000+(planName.length*53)%5800);  // stable contract # per plan
  return base.map((abbr,i)=>{const share=(n-i)/((n*(n+1))/2);const rx=Math.round(tot*share);
    const claims=Math.round(rx/63);const benes=Math.round(claims*0.42);
    return {plan:planName,planId:contract+'-'+String(i+1).padStart(3,'0'),abbr,rx,claims,benes};});
}

/* ============================ HELPERS ============================ */
const fmt=n=>n==null?'—':Math.abs(n)>=1e6?(n/1e6).toFixed(2)+'M':Math.abs(n)>=1e3?(n/1e3).toFixed(1)+'K':Math.round(n).toLocaleString();
const fmtFull=n=>n==null?'—':Math.round(n).toLocaleString();
const lerp=(a,b,t)=>Math.round(a+(b-a)*t);
const hx=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
const C0=hx('#ede9fe'),C1=hx('#a99cf2'),C2=hx('#5B4FE0'),C3=hx('#312e81');
function colorScale(t){
  if(t<=0)return '#eef0f4'; t=Math.max(0,Math.min(1,t)); let a,b,u;
  if(t<.34){a=C0;b=C1;u=t/.34;}else if(t<.67){a=C1;b=C2;u=(t-.34)/.33;}else{a=C2;b=C3;u=(t-.67)/.33;}
  return `rgb(${lerp(a[0],b[0],u)},${lerp(a[1],b[1],u)},${lerp(a[2],b[2],u)})`;
}
function useTip(){
  const show=(html,e)=>{const t=document.getElementById('tip');t.innerHTML=html;t.style.display='block';t.style.left=(e.clientX+14)+'px';t.style.top=(e.clientY+14)+'px';};
  const move=e=>{const t=document.getElementById('tip');t.style.left=(e.clientX+14)+'px';t.style.top=(e.clientY+14)+'px';};
  const hide=()=>{document.getElementById('tip').style.display='none';};
  return {show,move,hide};
}

/* ============================ SVG CHARTS (no chart lib) ============================ */
function HBar({data,labelKey,valueKey,labelW=150,color=ACCENT,fmtV=fmt,onRow}){
  const max=Math.max(...data.map(d=>d[valueKey]))||1;
  return <div style={{padding:'10px 16px 16px'}}>{data.map((d,i)=>(
    <div className="hbrow" key={i} style={onRow?{cursor:'pointer'}:null} onClick={()=>onRow&&onRow(d)}>
      <div className="hlbl" style={{width:labelW}} title={d[labelKey]}>{d[labelKey]}</div>
      <div className="htrk"><i style={{width:(d[valueKey]/max*100)+'%',background:color}}></i></div>
      <div className="hval">{fmtV(d[valueKey])}</div>
    </div>))}</div>;
}
function OverlayBars({data}){
  const max=Math.max(...data.map(d=>d.prev))||1;
  return <div style={{padding:'8px 16px 12px'}}>{data.map((d,i)=>(<div key={i} style={{marginBottom:9}}>
    <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'#4b4670'}}><span>{d.name}</span>
      <span style={{color:'#9ca3af'}}>{fmt(d.treated)} treated / {fmt(d.prev)} prev</span></div>
    <div style={{position:'relative',height:13,background:'#f4f2fc',borderRadius:4,marginTop:3}}>

      <div style={{position:'absolute',top:0,bottom:0,left:0,width:(d.treated/max*100)+'%',background:ACCENT,borderRadius:4}}></div>
    </div></div>))}</div>;

function AreaTrend({data}){
  const W=560,H=250,pad=42,bot=24;
  const max=Math.max(...data.map(d=>d.rx));
  const X=i=>pad+i*((W-pad-12)/(data.length-1));
  const Y=v=>H-bot-(v/max)*(H-bot-14);
  const line=data.map((d,i)=>`${X(i)},${Y(d.rx)}`).join(' ');
  const area=`${X(0)},${H-bot} `+data.map((d,i)=>`${X(i)},${Y(d.rx)}`).join(' ')+` ${X(data.length-1)},${H-bot}`;
  const tip=useTip();
  return <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto'}}>
    {[0,.25,.5,.75,1].map((g,i)=><line key={i} x1={pad} x2={W-8} y1={Y(max*g)} y2={Y(max*g)} stroke="#f1eefb"/>)}
    {[0,.5,1].map((g,i)=><text key={'y'+i} x={4} y={Y(max*g)+3} fontSize={9} fill="#9ca3af">{fmt(max*g)}</text>)}
    <polygon points={area} fill={ACCENT} fillOpacity={.12}/>
    <polyline points={line} fill="none" stroke={ACCENT} strokeWidth={2.5}/>
    {data.map((d,i)=><g key={i}><circle cx={X(i)} cy={Y(d.rx)} r={3.4} fill={ACCENT}
      style={{cursor:'pointer'}} onMouseEnter={e=>tip.show(`<b>${d.period}</b><div class="d">${fmtFull(d.rx)} Rx</div>`,e)} onMouseMove={tip.move} onMouseLeave={tip.hide}/>
      <text x={X(i)} y={H-7} textAnchor="middle" fontSize={10} fill="#6b7280">{d.period}</text></g>)}
  </svg>;
}
function Bubble({data,onPick}){
  const W=460,H=270,padL=46,padB=30;
  const maxX=Math.max(...data.map(d=>d.x)),maxY=Math.max(...data.map(d=>d.y))||1;
  const X=v=>padL+(v/maxX)*(W-padL-14);
  const Y=v=>H-padB-(v/maxY)*(H-padB-12);
  const tip=useTip();
  return <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto'}}>
    {[0,.5,1].map((g,i)=><line key={i} x1={padL} x2={W-8} y1={Y(maxY*g)} y2={Y(maxY*g)} stroke="#f1eefb"/>)}
    <line x1={padL} x2={padL} y1={8} y2={H-padB} stroke="#e7e5f0"/>
    <line x1={padL} x2={W-8} y1={H-padB} y2={H-padB} stroke="#e7e5f0"/>
    {[0,.5,1].map((g,i)=><text key={'y'+i} x={6} y={Y(maxY*g)+3} fontSize={9} fill="#9ca3af">{fmt(maxY*g)}</text>)}
    {[0,.5,1].map((g,i)=><text key={'x'+i} x={X(maxX*g)} y={H-padB+13} fontSize={9} fill="#9ca3af" textAnchor="middle">{fmt(maxX*g)}</text>)}
    {data.map((d,i)=><circle key={i} cx={X(d.x)} cy={Y(d.y)} r={4+Math.sqrt(Math.max(d.z,.2))*2.4} fill={colorScale(d.z/38)} fillOpacity={.72} stroke="#fff" style={{cursor:'pointer'}}
      onClick={()=>onPick&&onPick(d.full)}
      onMouseEnter={e=>tip.show(`<b>${d.full}</b><div class="d">Prevalent ${fmt(d.x)} · Treated ${fmt(d.y)}<br/>Penetration ${d.z.toFixed(1)}/1k</div>`,e)} onMouseMove={tip.move} onMouseLeave={tip.hide}/>)}
    {data.filter(d=>d.z>9||d.x>55000).map((d,i)=><text key={'t'+i} x={X(d.x)} y={Y(d.y)-9} textAnchor="middle" fontSize={9} fill="#4b4670" fontWeight={700}>{d.name}</text>)}
    <text x={padL} y={H-4} fontSize={10} fill="#9ca3af">Prevalent beneficiaries →</text>
    <text x={8} y={14} fontSize={10} fill="#9ca3af">Treated ↑</text>
  </svg>;
}
function PlanMixBars({data,series,colors}){
  const W=560,H=250,bot=26,top=8;const slot=(W-24)/data.length;const bw=Math.min(46,slot-12);
  return <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto'}}>
    {data.map((d,i)=>{const x=14+i*slot+(slot-bw)/2;const full=H-bot-top;let acc=0;
      return <g key={i}>
        {series.map((s,si)=>{const h=(d[s]/100)*full;const y=top+acc;acc+=h;
          return <rect key={s} x={x} y={y} width={bw} height={h} fill={colors[si]}/>;})}
        <text x={x+bw/2} y={H-9} textAnchor="middle" fontSize={10} fill="#6b7280">{d.period}</text>
      </g>;})}
  </svg>;
}
function Sparkline({data,w=84,h=24,color=ACCENT}){
  const max=Math.max(...data),min=Math.min(...data);
  const pts=data.map((v,i)=>`${(i/(data.length-1))*w},${h-((v-min)/(max-min||1))*(h-4)-2}`).join(' ');
  return <svg className="spark" width={w} height={h}><polyline points={pts} fill="none" stroke={color} strokeWidth={1.8}/>
    <circle cx={w} cy={h-((data[data.length-1]-min)/(max-min||1))*(h-4)-2} r={2.4} fill={color}/></svg>;
}

/* ============================ MULTI-SELECT ============================ */
function MultiSelect({label,options,selected,onChange,searchable,placeholder,disabledMsg,single}){
  const [open,setOpen]=useState(false);const [q,setQ]=useState('');const ref=useRef();
  useEffect(()=>{const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};document.addEventListener('mousedown',h);return()=>document.removeEventListener('mousedown',h);},[]);
  const filtered=options.filter(o=>o.toLowerCase().includes(q.toLowerCase()));
  const toggle=o=>{if(single){onChange([o]);setOpen(false);return;}onChange(selected.includes(o)?selected.filter(x=>x!==o):[...selected,o]);};
  const display=disabledMsg?disabledMsg:(selected.length===0?(placeholder||'All'):selected.length===1?selected[0]:`${selected.length} selected`);
  return (<div className="fg" ref={ref}>
    <span className="lbl">{label}</span>
    <div className="msel" onClick={()=>!disabledMsg&&setOpen(o=>!o)}>
      <span className={selected.length===0&&!disabledMsg?'ph':''} style={{whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',maxWidth:180}}>{display}</span>
      <span style={{color:'#9ca3af',fontSize:11}}>▾</span>
    </div>
    {open&&!disabledMsg&&(<div className="pop">
      {searchable&&<input className="search" placeholder="Search…" value={q} onChange={e=>setQ(e.target.value)} autoFocus/>}
      {filtered.map(o=>(<label className="opt" key={o}><input type={single?'radio':'checkbox'} checked={selected.includes(o)} onChange={()=>toggle(o)}/>{o}</label>))}
      {filtered.length===0&&<div className="opt disabled">No matches</div>}
    </div>)}
  </div>);
}

const GRID={AK:[0,0],ME:[0,10],VT:[1,9],NH:[1,10],WA:[2,1],ID:[2,2],MT:[2,3],ND:[2,4],MN:[2,5],IL:[2,6],WI:[2,7],MI:[2,8],NY:[2,9],MA:[2,10],RI:[2,11],
 OR:[3,1],NV:[3,2],WY:[3,3],SD:[3,4],IA:[3,5],IN:[3,6],OH:[3,7],PA:[3,8],NJ:[3,9],CT:[3,10],
 CA:[4,1],UT:[4,2],CO:[4,3],NE:[4,4],MO:[4,5],KY:[4,6],WV:[4,7],VA:[4,8],MD:[4,9],DE:[4,10],
 AZ:[5,2],NM:[5,3],KS:[5,4],AR:[5,5],TN:[5,6],NC:[5,7],SC:[5,8],DC:[5,9],
 OK:[6,4],LA:[6,5],MS:[6,6],AL:[6,7],GA:[6,8],HI:[7,1],TX:[7,4],FL:[7,9]};
function HexMap({metric,onState,selectedStates}){
  const tip=useTip();const cell=46,gap=5,cols=12,rows=8;
  const maxv=Math.max(...STATES.map(s=>s[metric.key]||0))||1;
  return (<svg viewBox={`0 0 ${cols*(cell+gap)} ${rows*(cell+gap)}`} style={{width:'100%',height:'auto'}}>
    {STATE_DEFS.map(([abbr,name])=>{const g=GRID[abbr];if(!g)return null;const s=byAbbr[abbr];const v=s[metric.key];
      const x=g[1]*(cell+gap),y=g[0]*(cell+gap);const sel=selectedStates.includes(name);
      return <g key={abbr} style={{cursor:'pointer'}} onClick={()=>onState(name)}
        onMouseEnter={e=>tip.show(`<b>${name}</b><div class="d">${metric.label}: <b>${metric.fmt(v)}</b></div>`,e)} onMouseMove={tip.move} onMouseLeave={tip.hide}>
        <rect x={x} y={y} width={cell} height={cell} rx={8} fill={metric.zeroGrey&&v===0?'#e9e7ef':colorScale(v/maxv)} stroke={sel?ACCENT:'#fff'} strokeWidth={sel?2.2:1}/>
        <text x={x+cell/2} y={y+cell/2+4} textAnchor="middle" fontSize={12} fontWeight={700} fill={v/maxv>.55?'#fff':'#4b4670'}>{abbr}</text>
      </g>;})}
  </svg>);
}
function USMap({metric,onState,selectedStates,drillState}){
  const [topo,setTopo]=useState(null);const [fail,setFail]=useState(false);const tip=useTip();
  useEffect(()=>{
    if(!window.d3||!window.topojson){setFail(true);return;}
    fetch('https://cdn.jsdelivr.net/npm/us-atlas@3/counties-10m.json').then(r=>r.json())
      .then(t=>setTopo(t)).catch(()=>setFail(true));
  },[]);
  const W=720,H=440;
  const view=useMemo(()=>{
    if(!topo||!window.d3)return null;
    const states=window.topojson.feature(topo,topo.objects.states).features;
    if(!drillState){
      const proj=window.d3.geoAlbersUsa().fitSize([W,H],{type:'FeatureCollection',features:states});
      const pg=window.d3.geoPath(proj);const key=metric.key;
      const maxv=Math.max(...STATES.map(s=>s[key]||0))||1;
      return {mode:'state',maxv,paths:states.map(f=>{const s=byName[f.properties.name];return{d:pg(f),name:f.properties.name,v:s?s[key]:0,s};})};
    }
    const st=byName[drillState];const fips=st&&st.fips;
    const counties=window.topojson.feature(topo,topo.objects.counties).features.filter(c=>String(c.id).slice(0,2)===fips);
    if(!counties.length)return {mode:'empty'};
    const proj=window.d3.geoAlbersUsa().fitSize([W,H],{type:'FeatureCollection',features:counties});
    const pg=window.d3.geoPath(proj);const ckey=(metric.id==='mkt_county')?'prev':'rx';
    const rows=counties.map(c=>({d:pg(c),name:c.properties.name,cv:countyVal(String(c.id),st)}));
    const maxv=Math.max(...rows.map(r=>r.cv[ckey]||0))||1;
    return {mode:'county',ckey,maxv,paths:rows.map(r=>({...r,v:r.cv[ckey]}))};
  },[topo,metric,drillState]);
  if(fail)return <HexMap metric={metric} onState={onState} selectedStates={selectedStates}/>;
  if(!view)return <div style={{height:H,display:'flex',alignItems:'center',justifyContent:'center',color:'#9ca3af'}}>Loading map…</div>;
  if(view.mode==='empty')return <div style={{height:H,display:'flex',alignItems:'center',justifyContent:'center',color:'#9ca3af'}}>No county geometry for this state</div>;
  return (<svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto'}}>
    {view.mode==='state'
      ? view.paths.map((p,i)=>{const sel=p.s&&selectedStates.includes(p.s.name);
          return <path key={i} className="state-path" d={p.d} fill={metric.zeroGrey&&p.v===0?'#e9e7ef':colorScale(p.v/view.maxv)}
            stroke={sel?ACCENT:'#fff'} strokeWidth={sel?2.2:.7} onClick={()=>p.s&&onState(p.s.name)}
            onMouseEnter={e=>p.s&&tip.show(`<b>${p.name}</b><div class="d">${metric.label}: <b>${metric.fmt(p.v)}</b></div><div class="d">Rx ${fmt(p.s.rx)} · Prevalent ${fmt(p.s.prev)}</div>`,e)}
            onMouseMove={tip.move} onMouseLeave={tip.hide}/>;})
      : view.paths.map((p,i)=>(<path key={i} className="state-path" d={p.d} fill={colorScale(p.v/view.maxv)} stroke="#fff" strokeWidth={.5}
            onMouseEnter={e=>tip.show(`<b>${p.name}</b><div class="d">Rx <b>${fmt(p.cv.rx)}</b></div><div class="d">Benes ~${fmt(p.cv.bene)} · Claims ~${fmt(p.cv.claims)} <i>(less count)</i></div>`,e)}
            onMouseMove={tip.move} onMouseLeave={tip.hide}/>))}
  </svg>);
}

    </div>
    <div className="grid-even">
      <div className="card">
        <div className="card-hd"><div><div className="card-ttl">State × Plan detail</div><div className="card-sub">Inherits Year / Half-year / State / Plan — County does not apply here</div></div><button className="export">⬇ Export</button></div>
        <div className="scrollbox" style={{maxHeight:340,marginTop:8}}>
          <table className="rtbl"><thead><tr><th>State</th><th>Plan</th><th className="num">Rx Qty</th><th className="num">Claims</th><th className="num">Benes</th>
            <th className="num">Prevalent <span className="infodot" title="2024 state-level figure for context — do not sum this column">i</span></th></tr></thead>
            <tbody>{stateXplan.map((r,i)=>(<tr key={i} onClick={()=>openDrawer(r.state)}>
              <td><b>{r.abbr}</b></td><td style={{maxWidth:150,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',fontSize:12}}>{r.plan}</td>
              <td className="num">{fmtFull(r.rx)}</td><td className="num" style={{color:'#6b7280'}}>{fmtFull(r.claims)}</td>
              <td className="num" style={{color:'#6b7280'}}>{r.benes<11?'<11':fmtFull(r.benes)}</td>
              <td className="num" style={{color:'#9ca3af'}}>{fmtFull(r.prev)}</td></tr>))}</tbody></table>
        </div>
      </div>
      <div className="card">
        <div className="card-hd"><div><div className="card-ttl">Plan-ID breakdown</div><div className="card-sub" style={{maxWidth:300}}>{selPlan} · {idRows.length} state-plan instance{idRows.length!==1?'s':''}</div></div><button className="export">⬇ Export</button></div>
        <div className="scrollbox" style={{maxHeight:340,marginTop:8}}>
          <table className="rtbl"><thead><tr><th>Plan ID</th><th>State</th><th className="num">Rx Qty</th><th className="num">Claims</th><th className="num">Benes</th></tr></thead>
            <tbody>{idRows.map((r,i)=>(<tr key={i} style={{cursor:'default'}}>
              <td><span style={{fontFamily:'monospace',fontSize:12}}>{r.planId}</span></td><td><b>{r.abbr}</b></td>
              <td className="num">{fmtFull(r.rx)}</td><td className="num" style={{color:'#6b7280'}}>{fmtFull(r.claims)}</td>
              <td className="num" style={{color:'#6b7280'}}>{r.benes<11?'<11':fmtFull(r.benes)}</td></tr>))}</tbody></table>
        </div>
        <div className="footer-note" style={{padding:'0 18px 16px'}}>A plan spread across many states shows one row per state-instance. Beneficiary counts below 11 are CMS-suppressed.</div>
      </div>
    </div>
  </Fragment>);
}

/* ============================ DRAWER ============================ */
function StateDrawer({stateName,onClose,goPayer}){
  const s=stateName?byName[stateName]:null;
  const counties=useMemo(()=>{if(!s)return[];const r=rng(stateName.length*17);
    return Array.from({length:Math.min(8,s.counties)},(_,i)=>({name:['Central','Harris','Jefferson','Madison','Franklin','Washington','Lincoln','Marion'][i]+' County',
      rx:Math.round(s.rx*((8-i)/36)*(0.7+r()*0.6))})).sort((a,b)=>b.rx-a.rx);},[stateName]);
  return (<div className={'ovl'+(s?' show':'')} onMouseDown={e=>{if(e.target.classList.contains('ovl'))onClose();}}>
    <div className="drawer">{s&&<Fragment>
      <div className="dh"><div><div className="t">{s.name}</div><div className="s">{s.abbr} · {s.counties} treated counties · penetration {s.pen.toFixed(1)}/1k (state level)</div></div>
        <button className="x" onClick={onClose}>✕</button></div>
      <div className="db">
        <div className="d-sec">Market snapshot <span className="badge24">2024 snapshot</span></div>
        <div className="mini-kpis">
          <div className="mk"><div className="l">Rx Quantity</div><div className="v">{fmt(s.rx)}</div></div>
          <div className="mk"><div className="l">Treated benes*</div><div className="v">{s.treated<11?'<11':fmt(s.treated)}</div></div>
          <div className="mk"><div className="l">Prevalent</div><div className="v">{fmt(s.prev)}</div></div>
          <div className="mk"><div className="l">Penetration/1k</div><div className="v">{s.pen.toFixed(1)}</div></div>
          <div className="mk"><div className="l">Claims*</div><div className="v">{fmt(s.claims)}</div></div>
          <div className="mk"><div className="l">Counties</div><div className="v">{s.counties}</div></div>
        </div>
        <div className="d-sec">Payer mix</div>
        <div style={{display:'flex',height:30,borderRadius:8,overflow:'hidden',border:'1px solid var(--border)'}}>
          <div style={{width:'88%',background:ACCENT,color:'#fff',fontSize:11,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center'}}>MCO 88%</div>
          <div style={{width:'12%',background:'#c7bdf6',fontSize:11,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',color:'#4b4670'}}>FFS</div>
        </div>
        <div className="d-sec">County breakdown</div>
        <table className="rtbl"><thead><tr><th>County</th><th className="num">Rx Quantity</th></tr></thead>
          <tbody>{counties.map((c,i)=>(<tr key={i} style={{cursor:'default'}}><td>{c.name}</td><td className="num"><b>{fmt(c.rx)}</b></td></tr>))}</tbody></table>
        <div className="footer-note">* Beneficiaries &amp; Claims are CMS-suppressed for cells below 11 — figures are approximate lower bounds.</div>
        <button className="link-btn" onClick={()=>goPayer(s.name)}>View in Payer &amp; Plan →</button>
      </div></Fragment>}</div>
  </div>);
}

/* ============================ APP ============================ */
const ALL_STATE_NAMES=STATE_DEFS.map(s=>s[1]);
function App(){
  const [tab,setTab]=useState('overview');
  const [filters,setFilters]=useState({year:['2024'],halves:['H2'],states:[],counties:[],plans:[]});
  const [drawer,setDrawer]=useState(null);
  const set=upd=>setFilters(typeof upd==='function'?upd:f=>({...f,...upd}));
  const scope=useMemo(()=>{
    let st=STATES;if(filters.states.length)st=STATES.filter(s=>filters.states.includes(s.name));
    const yf=({'2024':1,'2023':0.21,'2022':0.07})[filters.year[0]]||1;
    const hf=filters.halves.length===2?1.8:(filters.halves[0]==='H2'?1:0.8);
    const sf=filters.states.length?st.reduce((a,s)=>a+s.rx,0)/STATES.reduce((a,s)=>a+s.rx,0):1;
    const factor=Math.max(0.02,yf*hf*sf);                 // state-level (Claims / Benes / Penetration)
    const countySelected=filters.counties.length>0;
    const countyFactor=countySelected?Math.min(0.7,0.16*filters.counties.length+0.06):1;
    return {states:st,factor,countySelected,rxFactor:factor*countyFactor};  // rxFactor refines to county
  },[filters]);
  const countyOpts=filters.states.length?['Central','Harris','Jefferson','Madison','Franklin','Washington','Lincoln','Marion'].map(c=>c+' County'):[];
  return (<Fragment>
    <div className="appbar"><div className="appbar-in">
      <div className="brand"><div className="logo">i</div><div><div className="ttl">Incyte Market Insights</div><div className="sub">Medicaid TMSIS · 2022–2024 · Vitiligo / Atopic Dermatitis</div></div></div>
      <div className="right"><button className="pill-btn">⌕ Search</button><button className="pill-btn">⬇ Export</button><div className="avatar">MA</div></div>
    </div></div>
    <div className="tabs">
      <div className={'tab'+(tab==='overview'?' active':'')} onClick={()=>setTab('overview')}>Market Overview</div>
      <div className={'tab'+(tab==='payer'?' active':'')} onClick={()=>setTab('payer')}>Payer &amp; Plan</div>
    </div>
    <div className="wrap">
      <div className="fbar">
        <div className="fg"><span className="lbl">Year</span><div className="seg">{['2022','2023','2024'].map(y=>(<button key={y} className={filters.year[0]===y?'on':''} onClick={()=>set({year:[y]})}>{y}</button>))}</div></div>
        <div className="fg"><span className="lbl">Half-year</span><div className="seg">{['H1','H2'].map(h=>(<button key={h} className={filters.halves.includes(h)?'on':''}
          onClick={()=>set(f=>({...f,halves:f.halves.includes(h)?(f.halves.length>1?f.halves.filter(x=>x!==h):f.halves):[...f.halves,h]}))}>{h}</button>))}</div></div>
        <MultiSelect label="State" options={ALL_STATE_NAMES} selected={filters.states} searchable placeholder="All states" onChange={v=>set({states:v,counties:[]})}/>
        <MultiSelect label="County" options={countyOpts} selected={filters.counties} searchable disabledMsg={filters.states.length?null:'pick a state first'} placeholder="All counties" onChange={v=>set({counties:v})}/>
        <MultiSelect label="Plan Name" options={TOP_PLANS.map(p=>p.name)} selected={filters.plans} searchable placeholder="All plans" onChange={v=>set({plans:v})}/>
        <button className="btn">Apply</button>
        <button className="btn subtle" onClick={()=>set({year:['2024'],halves:['H2'],states:[],counties:[],plans:[]})}>Clear All</button>
        <div style={{marginLeft:'auto'}}><span className="saved-chip">★ DC-GA-CA</span></div>
      </div>
      <div className="footer-note" style={{margin:'-8px 0 14px',display:'flex',alignItems:'center',gap:7,lineHeight:1.5}}>
        <span className="infodot" title="Data-model note">i</span>
        <span>Rx Quantity is available to county level. Claims, Beneficiaries, and Penetration are reported at state/plan level. Market size is a 2024 prevalence snapshot. Counts under 11 are CMS-suppressed.</span>
      </div>
      {(filters.states.length>0||filters.plans.length>0)&&<div className="chips-row">
        <span style={{fontSize:11.5,color:'#9ca3af',fontWeight:600}}>Filters:</span>
        {filters.states.map(s=><span className="chip" key={s}>{s}<span className="x" onClick={()=>set(f=>({...f,states:f.states.filter(x=>x!==s),counties:[]}))}>✕</span></span>)}
        {filters.plans.map(p=><span className="chip" key={p} style={{maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p}<span className="x" onClick={()=>set(f=>({...f,plans:f.plans.filter(x=>x!==p)}))}>✕</span></span>)}
      </div>}
      {tab==='overview'
        ? <MarketOverview filters={filters} setFilters={set} scope={scope} openDrawer={n=>setDrawer(n)}/>
        : <PayerPlan openDrawer={n=>setDrawer(n)}/>}
    </div>
    <StateDrawer stateName={drawer} onClose={()=>setDrawer(null)} goPayer={n=>{setDrawer(null);set(f=>({...f,states:f.states.includes(n)?f.states:[...f.states,n]}));setTab('payer');}}/>
  </Fragment>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
  (function(){
    try{
      var src = document.getElementById('appsrc').textContent;
      var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
      (0, eval)(out);
    }catch(e){
      console.error(e);
      document.getElementById('root').innerHTML =
        '<pre style="padding:24px;color:#b91c1c;white-space:pre-wrap;font:13px monospace">'+(e&&e.message||e)+'</pre>';
    }
  })();
</script>
</body>
</html>

# ─────────────────────────────────────────────────────────────────────────────
# posterra Helm chart — default values
#
# Common defaults. Per-env values live in values.dev.yaml / values.staging.yaml
# and are layered on top with `helm install -f values.<env>.yaml`.
#
# deploymentMode drives the workload topology:
#   "combined" — one Deployment running portal+admin+cron in a single pod
#                (dev: fits cheaply on the small user node pool)
#   "split"    — separate odoo-portal / odoo-admin Deployments + odoo-cron
#                StatefulSet (staging: the prod-replica host-based split)
# ─────────────────────────────────────────────────────────────────────────────

# Container image — repository is fixed; tag MUST be set per-env (use
# -f values.<env>.yaml or --set image.tag=<sha>). The chart's
# posterra.image helper enforces this via Helm's `required`, so an empty
# tag fails fast at render time instead of pulling a stale image.
image:
  repository: earlyreadsaasacreread.azurecr.io/odoo
  tag: ""
  pullPolicy: IfNotPresent

# NGINX sidecar — stock alpine image; config comes from a ConfigMap.
nginx:
  image: nginx:1.27-alpine

# PostgreSQL connection — only the non-secret bits. db_password comes from
# Key Vault via the ExternalSecret. Set host/name per-env.
database:
  host: ""
  port: "5432"
  user: psadmin
  name: ""

# External Secrets Operator — which ClusterSecretStore (created in M3's
# services layer) this release pulls KV secrets from. Set per-env.
externalSecrets:
  clusterSecretStore: ""

# cert-manager — which ClusterIssuer the Ingress requests its wildcard cert
# from. Start with letsencrypt-staging; flip to letsencrypt-prod once the
# DNS-01 flow is verified end-to-end.
certManager:
  clusterIssuer: letsencrypt-staging

# Azure Files filestore — the M2-created share, mounted at /var/lib/odoo.
# storageAccount + resourceGroup are set per-env (the CSI driver needs both
# to address the share). The account key + name are pulled from KV by the
# filestore ExternalSecret.
filestore:
  storageAccount: ""
  resourceGroup: ""
  shareName: odoo-filestore
  size: 100Gi
  # uid/gid the share is mounted as — must match the odoo user in the image.
  uid: "101"
  gid: "101"

# Ingress / DNS. baseDomain is set per-env (dev.earlyread.ai / staging...).
ingress:
  baseDomain: ""
  # AGIC ingress class annotation value.
  classAnnotation: azure/application-gateway

# Init Job — runs `odoo -d <db> -i|-u <addons> --stop-after-init` as a Helm
# pre-install/pre-upgrade hook. mode "install" → -i, "upgrade" → -u.
init:
  mode: install

serviceAccount:
  name: posterra

# Workload topology — overridden per-env.
deploymentMode: ""
deployments: {}
cron:
  enabled: false

# Page PDF export — Gotenberg render service (own Deployment + ClusterIP
# Service). OFF by default. Before enabling in an env:
#   1. create Key Vault secrets pdf-render-user, pdf-render-password,
#      pdf-fingerprint-key (see externalsecret-odoo.yaml);
#   2. (recommended) mirror the image into ACR so pulls don't depend on
#      Docker Hub:  az acr import --name earlyreadsaasacreread
#        --source docker.io/gotenberg/gotenberg:8.37.0-chromium
#        --image gotenberg:8.37.0-chromium
#      then set pdf.image.repository to earlyreadsaasacreread.azurecr.io/gotenberg.
# Flags verified on 8.37.0 in phase 0 (page-pdf-export-phase0-findings.md).
pdf:
  enabled: false
  image:
    repository: docker.io/gotenberg/gotenberg
    tag: 8.37.0-chromium
    # Pinned by digest; the tag is informational. Re-verify flags on any bump.
    digest: sha256:0d28ae9a96441588ef739623726bd500ad0720b77266c6f1351a13e333fbd61c
  replicas: 1
  # = the Odoo render reserve (services/pdf_export/limits.py RENDER_RESERVE_S)
  # so Gotenberg cancels a conversion when Odoo stops waiting.
  apiTimeout: 8s
  bodyLimit: 12MB
  # One export runs cluster-wide at a time (Odoo advisory lock) → one
  # conversion; the queue size COUNTS the in-flight conversion.
  maxConcurrency: 1
  queueSize: 2
  restartAfter: 50
  fingerprintKeyVersion: env-1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1536Mi

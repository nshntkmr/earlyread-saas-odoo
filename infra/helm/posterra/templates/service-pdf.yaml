{{- if .Values.pdf.enabled }}
# ClusterIP only — never exposed through the Ingress / App Gateway.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "posterra.fullname" . }}-pdf
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "posterra.labels" . | nindent 4 }}
    posterra.io/role: pdf
spec:
  type: ClusterIP
  selector:
    {{- include "posterra.selectorLabels" . | nindent 4 }}
    posterra.io/role: pdf
  ports:
    - name: http
      port: 3000
      targetPort: http
{{- end }}

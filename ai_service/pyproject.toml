[project]
name = "posterra-ai-service"
version = "0.1.0"
description = "Posterra AI Assist MCP service — exposes the Odoo AI gateway to MCP clients (Claude Desktop now; ChatGPT web pending OAuth front-end)."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.3",
    "httpx>=0.27",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
posterra-mcp = "app.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
